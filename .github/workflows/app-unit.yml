# PHP unit tests for the external apps living in apps/.
#
# This is the monorepo replacement for owncloud/reusable-workflows'
# php-unit.yml, and the diff against it is the point: that workflow takes a
# `core-ref` input, clones owncloud/core, then clones the app *into*
# core/apps/<app> -- two checkouts and a cross-repo version guess -- purely so
# the app's own Makefile can find ../../lib/composer/bin/phpunit. Here that path
# is just the repo, so the two checkout steps and both `core-ref` inputs are
# gone. Everything else (install the server, build the app, enable it, run its
# own `make test-php-unit`) is deliberately kept identical, so a green run here
# means the same thing it meant upstream.
#
# The 12 bundled apps are not tested here; they are core's own code and core's
# own suite in php-unit.yml already covers them.

on:
  workflow_call:
    inputs:
      apps:
        description: JSON array of app ids under apps/ to test
        required: true
        type: string
      php-versions:
        description: JSON array of PHP versions
        required: false
        type: string
        default: '["8.3"]'
      databases:
        description: >-
          JSON array of databases. Defaults to sqlite alone, which is the PR
          gate; the nightly run passes the full set. Upstream ran every app
          against 4 databases on every PR -- with 29 apps in one repo that is
          116 jobs for a one-line change, so the wide matrix moves to nightly
          rather than disappearing.
        required: false
        type: string
        default: '["sqlite"]'

permissions:
  contents: read

jobs:
  app-unit:
    name: ${{ matrix.app }} (php ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      # One broken app must not hide the state of the other 28.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
        php: ${{ fromJSON(inputs.php-versions) }}
        database: ${{ fromJSON(inputs.databases) }}

    services:
      # An empty image string means "no service", so each of these starts only
      # for the matrix entries that name it. Same pattern as php-unit.yml.
      mysql:
        image: >-
          ${{ (startsWith(matrix.database,'mysql:') || startsWith(matrix.database,'mariadb:')) && matrix.database || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: owncloud
          MYSQL_USER: owncloud
          MYSQL_PASSWORD: owncloud
        options: >-
          --health-cmd="mysqladmin ping -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      postgres:
        image: ${{ startsWith(matrix.database,'postgres:') && matrix.database || '' }}
        env:
          POSTGRES_DB: owncloud
          POSTGRES_USER: owncloud
          POSTGRES_PASSWORD: owncloud
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          # Same set the upstream app workflow enabled, so an app that needed an
          # extension there still finds it here.
          extensions: apcu, ctype, curl, exif, fileinfo, gd, iconv, imagick, intl, json, mbstring, memcached, pdo, posix, simplexml, xml, zip, smbclient, ldap
          ini-values: "memory_limit=1024M"

      - name: Install core dependencies
        run: make install-composer-deps

      - name: Install server
        env:
          DATA_DIRECTORY: ${{ github.workspace }}/data
          DB: ${{ matrix.database }}
          DB_NAME: owncloud
          DB_HOST: 127.0.0.1
          DB_USERNAME: owncloud
          DB_PASSWORD: owncloud
        run: |
          DB_TYPE=${DB%:*}
          if [ "$DB_TYPE" == "postgres" ] ; then DB_TYPE="pgsql"; fi
          if [ "$DB_TYPE" == "mariadb" ] ; then DB_TYPE="mysql"; fi
          install_cmd="maintenance:install -vvv \
            --database=${DB_TYPE} \
            --database-name=${DB_NAME} \
            --admin-user=admin \
            --admin-pass=admin \
            --data-dir=${DATA_DIRECTORY}"
          if [[ "${DB_TYPE}" != "sqlite" ]]; then
            install_cmd+=" --database-host=${DB_HOST} \
              --database-user=${DB_USERNAME} \
              --database-pass=${DB_PASSWORD}"
          fi
          # Unquoted on purpose -- install_cmd is a list of arguments and word
          # splitting is what turns it into one. Kept verbatim from upstream's
          # php-unit.yml so a failure here means the same thing it meant there.
          # shellcheck disable=SC2086
          php occ ${install_cmd}
          for app in files_sharing files_trashbin files_versions provisioning_api federation federatedfilesharing; do
            php occ app:enable "$app"
          done

      - name: Build and enable apps/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
        run: |
          # The same script the release build uses, reading the same
          # build_targets column, instead of the upstream `make vendor || true`
          # -- which silently passed for the 19 apps that have no `vendor`
          # target and silently passed again when a real one failed.
          tools/monorepo/app-build.sh "$APP"
          php occ app:enable "$APP"

      - name: Run PHPUnit
        env:
          APP: ${{ matrix.app }}
        run: |
          status="$(awk -F'\t' -v a="$APP" '!/^#/ && $1 == a { print $2 }' tools/monorepo/app-ci.tsv)"
          note="$(awk -F'\t' -v a="$APP" '!/^#/ && $1 == a { print $4 }' tools/monorepo/app-ci.tsv)"
          if [ -z "$status" ]; then
            echo "apps/$APP has no row in tools/monorepo/app-ci.tsv - add one" >&2
            exit 1
          fi
          if [ "$status" != "yes" ]; then
            # Not silent: 8 of the 29 apps cannot pass this gate, and a run that
            # skipped one has to say which and why in the summary, or the green
            # tick means less than it looks like.
            echo "::warning title=$APP php-unit skipped::$status - $note"
            # The backticks in the format string are markdown for the step
            # summary, not command substitution, so the single quotes are right.
            # shellcheck disable=SC2016
            printf '- **%s**: skipped (`%s`) - %s\n' "$APP" "$status" "$note" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `cd`, not `make -C`: 25 of the 29 app Makefiles build PHPUNIT from
          # $(PWD), which make inherits from the environment and never updates,
          # so under `make -C` the path resolves one directory short and phpunit
          # is silently not found. Upstream cd'd for the same reason.
          cd "apps/$APP"
          make test-php-unit

      - name: Tail server log
        if: failure()
        run: cat data/owncloud.log || true
